<svg id="intellistrata-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" height="100%" style="display:block; overflow:visible;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;display=swap');
      .logo-icon {
        fill: none;
        stroke: #00BFA5;
        stroke-width: 5.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo-text {
        fill: #FFFFFF;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 39px;
        font-weight: 550;
        letter-spacing: -0.35px;
      }
    </style>
  </defs>
  
  <!-- Icon Mark (3 ascending strata bars) -->
  <g class="logo-icon" transform="translate(4, 12)">
    <!-- Baseline -->
    <path d="M 6 86 L 75 86" />
    
    <!-- Col 1 (Short) -->
    <path d="M 6 86 L 6 55 Q 6 52 9 52 L 26 52 Q 29 52 29 55 L 29 86" />
    
    <!-- Col 2 (Medium) -->
    <path d="M 29 86 L 29 27 Q 29 24 32 24 L 49 24 Q 52 24 52 27 L 52 86" />
    
    <!-- Col 3 (Tall) -->
    <path d="M 52 86 L 52 5 Q 52 2 55 2 L 72 2 Q 75 2 75 5 L 75 86" />
  </g>
  
  <!-- Wordmark -->
  <text x="94" y="95" class="logo-text">Intellistrata</text>
</svg>